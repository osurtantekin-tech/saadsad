plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.rickcolor.portalkey'

base {
    archivesName = 'rick_portal_color_key-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                rick_portal_color_key {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // Rick's Stuff'a derleme bagimliligi YOK; addon sadece silahin NBT'sini degistiriyor.
    // Test icin run/mods klasorune Rick's Stuff jar'ini koyman yeterli.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
